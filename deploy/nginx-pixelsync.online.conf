server {
    listen 80;
    listen [::]:80;
    server_name pixelsync.online www.pixelsync.online;

    return 301 https://uusop.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pixelsync.online www.pixelsync.online;

    ssl_certificate /etc/letsencrypt/live/pixelsync.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixelsync.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://uusop.com$request_uri;
}
